name: Android APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'manifest.json', 'icons/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Ubuntu runner ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform.

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../point.apk

      - uses: actions/upload-artifact@v4
        with:
          name: point-apk
          path: point.apk

      # Each build on main becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/point.apk
      # The tag must match the app's versionCode (run number + 10, see android/app/build.gradle):
      # the in-app update check compares the number after the last dot with the installed version.
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OFFSET: 10
        run: |
          BUILD=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          gh release create "v1.0.$BUILD" point.apk \
            --title "Point 1.0.$BUILD" \
            --notes "Android build of commit ${{ github.sha }}. Download point.apk below and open it on your phone to install or update."
